spring:
  ai:
    dashscope:
      embedding:
        options:
          model: text-embedding-v2
    vectorstore:
      pgvector:
        dimensions: 1536
        schema-name: public
        table-name: knowledge_base_vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA:true}
        remove-existing-vector-store-table: false

knowledge-base:
  rag:
    enabled: ${KNOWLEDGE_BASE_RAG_ENABLED:true}
    knowledge-base-id: ${KNOWLEDGE_BASE_ID:default}
    source-directory: ${KNOWLEDGE_BASE_RAG_SOURCE_DIRECTORY:classpath:document}
    etl:
      enabled: ${KNOWLEDGE_BASE_ETL_ENABLED:true}
    retrieval:
      similarity-threshold: ${KNOWLEDGE_BASE_RAG_SIMILARITY_THRESHOLD:0.20}
      top-k: ${KNOWLEDGE_BASE_RAG_TOP_K:5}
      chunk-size: ${KNOWLEDGE_BASE_RAG_CHUNK_SIZE:500}
