spring:
  flyway:
    enabled: ${COMMUNITY_MIGRATIONS_ENABLED:true}
    locations: classpath:db/migration
    default-schema: public
    clean-disabled: true
    baseline-on-migrate: ${COMMUNITY_BASELINE_ON_MIGRATE:false}
    baseline-version: 0
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: knowledge-base-qa
  profiles:
    active: local,pgvector
  ai:
    retry:
      max-attempts: 4
      on-client-errors: false
      on-http-codes: [429]
      backoff:
        initial-interval: 10s
        multiplier: 2
        max-interval: 40s

server:
  port: 8123
  servlet:
    context-path: /api
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: STUDENT_SESSION
        http-only: true
        secure: ${STUDENT_COOKIE_SECURE:true}
        same-site: lax

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
    com.example.wjyaiagent.rag: debug

knowledge-base:
  chat:
    max-message-length: ${KNOWLEDGE_BASE_MAX_MESSAGE_LENGTH:2000}
    sse-timeout: ${KNOWLEDGE_BASE_SSE_TIMEOUT:60s}
    system-prompt: ${KNOWLEDGE_BASE_SYSTEM_PROMPT:classpath:prompts/knowledge-base-system.txt}
    memory:
      directory: ${KNOWLEDGE_BASE_CHAT_MEMORY_DIRECTORY:C:/Users/xdj/.codex/worktrees/knowledge-base-rag/wjy-ai-agent/chat-memory}
      max-messages: ${KNOWLEDGE_BASE_CHAT_MEMORY_MAX_MESSAGES:20}
  security:
    api-key: ${KNOWLEDGE_BASE_API_KEY:}
    rate-limit-per-minute: ${KNOWLEDGE_BASE_RATE_LIMIT_PER_MINUTE:30}
    rate-limit-burst: ${KNOWLEDGE_BASE_RATE_LIMIT_BURST:30}
