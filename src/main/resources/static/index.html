<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>恋爱助手 · AI 对话</title>
<style>
  :root {
    --bg: #f4f5f8;
    --card: #ffffff;
    --text: #181b21;
    --muted: #79808f;
    --line: #e4e7ee;
    --brand: #5b6cff;
    --brand2: #8b5cf6;
    --ring: rgba(91, 108, 255, .18);
    --danger: #d93a41;
    --danger-bg: #fff2f2;
    --danger-line: #f6d3d4;
    --shadow: 0 10px 30px -20px rgba(20, 26, 50, .35);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014;
      --card: #171a21;
      --text: #e9ebf2;
      --muted: #8b93a6;
      --line: #272b36;
      --ring: rgba(120, 134, 255, .25);
      --danger: #ff7d84;
      --danger-bg: rgba(229, 72, 77, .12);
      --danger-line: rgba(229, 72, 77, .32);
      --shadow: 0 10px 26px -20px rgba(0, 0, 0, .9);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:disabled { cursor: not-allowed; }

  .app {
    max-width: 820px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  /* 顶栏 */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px 8px;
  }

  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }

  .logo {
    width: 38px;
    height: 38px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .5px;
    box-shadow: 0 8px 18px -10px var(--brand);
  }

  .brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .2px; }

  .brand .sub {
    margin: 0;
    max-width: 54vw;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ghost {
    flex: 0 0 auto;
    padding: 7px 13px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    font-size: 13px;
    transition: color .15s, border-color .15s, transform .12s;
  }
  .ghost:hover { color: var(--text); border-color: var(--brand); }
  .ghost:active { transform: scale(.97); }

  /* API Key 行 */
  .keybar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 18px 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .keybar > label { flex: 0 0 auto; letter-spacing: .3px; }

  .keywrap { position: relative; flex: 1 1 auto; display: flex; align-items: center; min-width: 0; }

  .keywrap input {
    width: 100%;
    padding: 8px 54px 8px 11px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    letter-spacing: .2px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .keywrap input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); }
  .keywrap input::placeholder { color: var(--muted); opacity: .8; }

  .mini {
    position: absolute;
    right: 5px;
    padding: 4px 9px;
    border-radius: 8px;
    background: var(--bg);
    color: var(--muted);
    font-size: 12px;
  }
  .mini:hover { color: var(--brand); }

  /* 消息区 */
  .chat {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 6px 18px 16px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  .empty {
    margin: auto;
    padding: 28px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
    color: var(--muted);
    animation: fade .3s ease both;
  }
  .empty-icon { font-size: 30px; line-height: 1; }
  .empty-title { font-size: 15px; font-weight: 550; color: var(--text); }
  .empty-tip { font-size: 12px; }

  .msg { display: flex; align-items: flex-start; gap: 10px; animation: rise .2s ease both; }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }
  .msg.user .avatar {
    border-color: transparent;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff;
  }

  .msg .wrap { min-width: 0; max-width: min(78%, 620px); display: flex; flex-direction: column; }
  .msg.user .wrap { align-items: flex-end; }

  .bubble {
    max-width: 100%;
    padding: 10px 14px;
    border-radius: 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .msg.assistant .bubble {
    border: 1px solid var(--line);
    border-top-left-radius: 6px;
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .msg.user .bubble {
    border-top-right-radius: 6px;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff;
    box-shadow: 0 8px 20px -14px var(--brand);
  }

  .bubble.is-error {
    border-color: var(--danger-line);
    background: var(--danger-bg);
    box-shadow: none;
  }

  /* 打字机光标 / 等待提示 */
  .bubble.streaming::after {
    content: "";
    display: inline-block;
    width: 7px;
    height: 14px;
    margin-left: 3px;
    vertical-align: -2px;
    border-radius: 2px;
    background: currentColor;
    opacity: .55;
    animation: blink 1s steps(2, start) infinite;
  }
  .bubble.pending::before {
    content: "正在思考";
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 2px;
    animation: pulse 1.2s ease-in-out infinite;
  }

  /* 错误气泡内容 */
  .errchip {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--danger-line);
    background: var(--danger-bg);
    color: var(--danger);
    font-size: 13px;
    line-height: 1.5;
  }
  .bubble.is-error .errchip { margin-top: 0; padding: 0; border: 0; background: transparent; }

  .errcode {
    flex: 0 0 auto;
    padding: 1px 6px;
    border-radius: 6px;
    background: rgba(217, 58, 65, .12);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.7;
  }
  .errtext { min-width: 0; }

  /* 输入区 */
  .composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 18px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--bg);
  }

  .composer textarea {
    flex: 1 1 auto;
    min-height: 46px;
    max-height: 140px;
    padding: 11px 14px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    line-height: 1.5;
    resize: none;
    outline: none;
    overflow-y: auto;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); }
  .composer textarea::placeholder { color: var(--muted); }

  .send {
    flex: 0 0 auto;
    height: 46px;
    min-width: 76px;
    padding: 0 18px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 10px 22px -14px var(--brand);
    transition: transform .12s, opacity .15s, box-shadow .15s;
  }
  .send:hover:not(:disabled) { transform: translateY(-1px); }
  .send:active:not(:disabled) { transform: scale(.97); }
  .send:disabled { opacity: .45; box-shadow: none; }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* 移动端 */
  @media (max-width: 560px) {
    .topbar { padding: 10px 14px 6px; }
    .keybar { padding: 0 14px 8px; }
    .keybar > label { display: none; }
    .chat { gap: 12px; padding: 4px 14px 14px; }
    .composer { padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); }
    .msg .wrap { max-width: 84%; }
    .composer textarea { font-size: 16px; }
    .send { min-width: 68px; padding: 0 14px; font-size: 16px; }
    .brand .sub { max-width: 46vw; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">AI</div>
      <div>
        <h1>恋爱助手</h1>
        <p class="sub" id="statusText">准备就绪</p>
      </div>
    </div>
    <button type="button" id="newChatBtn" class="ghost">新会话</button>
  </header>

  <div class="keybar">
    <label for="apiKey">API Key</label>
    <div class="keywrap">
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false"
             placeholder="可选，填写后自动携带 X-API-Key" />
      <button type="button" id="toggleKey" class="mini" aria-label="显示 API Key">显示</button>
    </div>
  </div>

  <main id="chat" class="chat" role="log" aria-live="polite" aria-relevant="additions"></main>

  <footer class="composer">
    <textarea id="input" rows="1" maxlength="4000" enterkeyhint="send"
              placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button type="button" id="sendBtn" class="send" disabled>发送</button>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var ENDPOINT = '/api/ai/love/agent/chat/stream';
  var K_CHAT = 'wgd.ai.chatId';
  var K_KEY = 'wgd.ai.apiKey';

  var chatEl = document.getElementById('chat');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var newChatBtn = document.getElementById('newChatBtn');
  var apiKeyEl = document.getElementById('apiKey');
  var toggleKeyBtn = document.getElementById('toggleKey');
  var statusEl = document.getElementById('statusText');

  // sessionStorage 在隐私模式下可能抛错，统一包一层
  var store = {
    get: function (k) { try { return window.sessionStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { window.sessionStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { window.sessionStorage.removeItem(k); } catch (e) {} }
  };

  var chatId = store.get(K_CHAT);
  var sending = false;
  var controller = null;
  var generation = 0; // 每次发送/新会话自增，用于丢弃过期的回调

  /* ---------------- 界面工具 ---------------- */

  function setStatus(text) { statusEl.textContent = text; }

  function scrollToBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

  function showEmptyHint() {
    chatEl.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'empty';
    box.innerHTML =
      '<div class="empty-icon">💬</div>' +
      '<div class="empty-title">和 AI 恋爱助手聊聊吧</div>' +
      '<div class="empty-tip">Enter 发送 · Shift+Enter 换行</div>';
    chatEl.appendChild(box);
  }

  function removeEmptyHint() {
    var hint = chatEl.querySelector('.empty');
    if (hint) hint.parentNode.removeChild(hint);
  }

  // 返回上下文对象：便于流式追加与出错时复用同一个气泡
  function addMessage(role, text) {
    removeEmptyHint();

    var row = document.createElement('div');
    row.className = 'msg ' + role;

    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '我' : 'AI';

    var wrap = document.createElement('div');
    wrap.className = 'wrap';

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'assistant') bubble.classList.add('streaming', 'pending');
    bubble.textContent = text || '';

    wrap.appendChild(bubble);
    if (role === 'user') {
      row.appendChild(wrap);
      row.appendChild(avatar);
    } else {
      row.appendChild(avatar);
      row.appendChild(wrap);
    }
    chatEl.appendChild(row);
    scrollToBottom();

    return { el: row, bubble: bubble, failed: false, done: false, statusText: '' };
  }

  function appendDelta(ctx, delta) {
    if (!ctx || ctx.failed || !delta) return;
    if (ctx.bubble.classList.contains('pending')) ctx.bubble.classList.remove('pending');
    ctx.bubble.appendChild(document.createTextNode(delta));
    scrollToBottom();
  }

  function showErrorIn(ctx, code, message) {
    if (!ctx || ctx.failed) return;
    ctx.failed = true;
    ctx.statusText = '出错了';
    ctx.bubble.classList.remove('pending', 'streaming');

    var hadText = ctx.bubble.textContent.trim().length > 0;
    if (!hadText) ctx.bubble.classList.add('is-error');

    var chip = document.createElement('div');
    chip.className = 'errchip';
    if (code) {
      var codeEl = document.createElement('span');
      codeEl.className = 'errcode';
      codeEl.textContent = code;
      chip.appendChild(codeEl);
    }
    var textEl = document.createElement('span');
    textEl.className = 'errtext';
    textEl.textContent = message;
    chip.appendChild(textEl);

    ctx.bubble.appendChild(chip);
    setStatus('出错了');
    scrollToBottom();
  }

  /* ---------------- SSE 解析 ---------------- */

  // 解析一帧（不含分隔的 \n\n）：event / data 字段，忽略以 : 开头的注释行。
  // 返回 true 表示这一帧是终止帧（done / error）。
  function dispatchFrame(frame, ctx) {
    var event = 'message';
    var dataLines = [];
    var lines = frame.split('\n');

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (!line) continue;
      if (line.charAt(0) === ':') continue; // 注释行

      var sep = line.indexOf(':');
      var field, value;
      if (sep === -1) {
        field = line;
        value = '';
      } else {
        field = line.slice(0, sep);
        value = line.slice(sep + 1);
        if (value.charAt(0) === ' ') value = value.slice(1);
      }

      if (field === 'event') event = value.trim();
      else if (field === 'data') dataLines.push(value);
    }

    var raw = dataLines.join('\n');
    var obj = null;
    if (raw) {
      try { obj = JSON.parse(raw); } catch (e) { obj = null; }
    }

    if (event === 'message') {
      if (raw === '[DONE]') return true; // 兼容部分实现
      if (obj && obj.chatId) saveChatId(String(obj.chatId));
      appendDelta(ctx, obj && obj.delta != null ? String(obj.delta) : '');
      return false;
    }

    if (event === 'done') {
      if (obj && obj.chatId) saveChatId(String(obj.chatId));
      var ms = obj && typeof obj.elapsedMs === 'number' ? obj.elapsedMs : 0;
      ctx.done = true;
      ctx.bubble.classList.remove('pending', 'streaming');
      ctx.statusText = '已完成' + (ms ? ' · ' + (ms / 1000).toFixed(1) + ' 秒' : '');
      return true;
    }

    if (event === 'error') {
      var code = obj && obj.code ? String(obj.code) : 'STREAM_ERROR';
      var message = obj && obj.message ? String(obj.message) : '服务返回了未知错误';
      showErrorIn(ctx, code, message);
      return true;
    }

    return false;
  }

  // 手写 SSE 读取：buffer 累积，按 \n\n 切帧；不完整的半帧留在 buffer 里等下一块。
  function readStream(body, ctx) {
    var reader = body.getReader();
    var decoder = new TextDecoder('utf-8');
    var buffer = '';
    var terminal = false;

    function consume(final) {
      var cut;
      while (!terminal && (cut = buffer.indexOf('\n\n')) !== -1) {
        var frame = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        if (frame.trim()) terminal = dispatchFrame(frame, ctx);
      }
      // 流结束时可能还有没被 \n\n 收尾的最后一帧
      if (!terminal && final) {
        var tail = buffer.trim();
        buffer = '';
        if (tail) terminal = dispatchFrame(tail, ctx);
      }
    }

    function step() {
      return reader.read().then(function (chunk) {
        if (chunk.value) buffer += decoder.decode(chunk.value, { stream: true });
        if (chunk.done) buffer += decoder.decode();
        // 统一换行：跨 chunk 被切开的 \r\n 拼回来后也能正确归一
        buffer = buffer.replace(/\r\n/g, '\n');

        consume(!!chunk.done);

        if (terminal) {
          // 已经是终止帧，主动取消剩余读取（忽略取消时的异常）
          try {
            var cancelled = reader.cancel();
            if (cancelled && cancelled.catch) cancelled.catch(function () {});
          } catch (e) {}
          return;
        }
        if (chunk.done) return;
        return step();
      });
    }

    return step();
  }

  /* ---------------- 请求 ---------------- */

  function saveChatId(id) {
    if (!id || id === chatId) return;
    chatId = id;
    store.set(K_CHAT, id);
  }

  function parseRetryAfter(value) {
    if (!value) return null;
    var v = value.trim();
    if (/^\d+$/.test(v)) return parseInt(v, 10);
    var ts = Date.parse(v);
    if (!isNaN(ts)) {
      var s = Math.ceil((ts - Date.now()) / 1000);
      return s > 0 ? s : 0;
    }
    return null;
  }

  function handleHttpError(res, ctx) {
    return res.text().then(function (raw) {
      var obj = null;
      try { obj = raw ? JSON.parse(raw) : null; } catch (e) { obj = null; }
      var code = obj && obj.code ? String(obj.code) : '';
      var message = obj && obj.message ? String(obj.message) : '';

      if (res.status === 401) {
        showErrorIn(ctx, code || 'UNAUTHORIZED', '缺少或无效的 API Key');
        return;
      }

      if (res.status === 429) {
        var seconds = parseRetryAfter(res.headers.get('Retry-After'));
        var text = seconds === null
          ? '请求过于频繁，请稍后重试'
          : '请求过于频繁，请 ' + seconds + ' 秒后重试';
        showErrorIn(ctx, code || 'RATE_LIMITED', text);
        return;
      }

      showErrorIn(ctx, code || ('HTTP_' + res.status),
        message || ('请求失败（HTTP ' + res.status + '）'));
    });
  }

  function setSending(flag) {
    sending = flag;
    sendBtn.classList.toggle('busy', flag);
    sendBtn.textContent = flag ? '发送中' : '发送';
    updateSendState();
  }

  function updateSendState() {
    sendBtn.disabled = sending || inputEl.value.trim().length === 0;
  }

  function send() {
    if (sending) return;
    var text = inputEl.value.trim();
    if (!text) return;

    var myGen = ++generation;

    inputEl.value = '';
    autoGrow();
    updateSendState();

    addMessage('user', text);
    var ctx = addMessage('assistant', '');
    setSending(true);
    setStatus('正在思考…');

    controller = new AbortController();

    var headers = { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' };
    var key = store.get(K_KEY).trim();
    if (key) headers['X-API-Key'] = key;

    var payload = { message: text };
    if (chatId) payload.chatId = chatId;

    fetch(ENDPOINT, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(payload),
      signal: controller.signal
    })
      .then(function (res) {
        if (!res.ok) return handleHttpError(res, ctx);
        if (!res.body) {
          showErrorIn(ctx, 'STREAM_UNAVAILABLE', '当前浏览器不支持流式响应');
          return;
        }
        return readStream(res.body, ctx);
      })
      .catch(function (err) {
        if (err && err.name === 'AbortError') return;
        if (ctx.failed) return;
        showErrorIn(ctx, 'NETWORK_ERROR', '网络异常：' + ((err && err.message) || '请检查网络连接'));
      })
      .then(function () {
        if (myGen !== generation) return; // 已被新会话重置
        controller = null;
        setSending(false);
        if (ctx.bubble.parentNode) {
          ctx.bubble.classList.remove('pending', 'streaming');
          setStatus(ctx.statusText || (ctx.failed ? '出错了' : '连接已结束'));
        }
        inputEl.focus();
      });
  }

  function newChat() {
    generation++;
    if (controller) {
      try { controller.abort(); } catch (e) {}
      controller = null;
    }
    setSending(false);
    chatId = '';
    store.del(K_CHAT);
    showEmptyHint();
    inputEl.value = '';
    autoGrow();
    updateSendState();
    setStatus('已开始新会话');
    inputEl.focus();
  }

  /* ---------------- 输入框 ---------------- */

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  }

  inputEl.addEventListener('input', function () {
    autoGrow();
    updateSendState();
  });

  inputEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.shiftKey) return;                 // Shift+Enter 换行
    if (e.isComposing || e.keyCode === 229) return; // 输入法组词中
    if (sending) return;                    // 发送中允许回车换行，便于预写下一句
    e.preventDefault();
    send();
  });

  sendBtn.addEventListener('click', send);
  newChatBtn.addEventListener('click', newChat);

  apiKeyEl.addEventListener('input', function () {
    var v = apiKeyEl.value.trim();
    if (v) store.set(K_KEY, v);
    else store.del(K_KEY);
  });

  toggleKeyBtn.addEventListener('click', function () {
    var hidden = apiKeyEl.type === 'password';
    apiKeyEl.type = hidden ? 'text' : 'password';
    toggleKeyBtn.textContent = hidden ? '隐藏' : '显示';
    toggleKeyBtn.setAttribute('aria-label', hidden ? '隐藏 API Key' : '显示 API Key');
  });

  /* ---------------- 初始化 ---------------- */

  apiKeyEl.value = store.get(K_KEY);
  showEmptyHint();
  updateSendState();
  setStatus(chatId ? '已恢复上次会话' : '准备就绪');
})();
</script>
</body>
</html>
